version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: edu_api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

  web:
    image: nginx:alpine
    container_name: edu_web
    ports:
      - "8080:80"
    volumes:
      - ./src/web:/usr/share/nginx/html:ro

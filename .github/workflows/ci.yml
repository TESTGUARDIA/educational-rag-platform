name: CI
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks en ligne de commande : l'action GitHub exige une licence pour
      # les dépôts d'organisation, pas l'outil lui-même (licence MIT).
      # Clés déjà révoquées présentes dans l'historique : voir .gitleaksignore
      - name: gitleaks (historique complet)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q || [ $? -eq 5 ]
